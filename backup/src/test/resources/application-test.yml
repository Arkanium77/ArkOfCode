spring:
  config:
    import: ""
  cloud:
    config:
      enabled: false
      import-check:
        enabled: false
    discovery:
      enabled: true
      client:
        simple:
          instances:
            ark-user-test:
              - uri: http://localhost:10103
    loadbalancer:
      ribbon:
        enabled: false
    gateway:
      discovery:
        locator:
          enabled: true

server:
  port: 30303

elastic-search:
  scheme: http
  hosts:
    - localhost
  ports:
    - 9200
  initial-import:
    enabled: false

feign:
  client.config.default:
    readTimeout: 15000
    connectTimeout: 15000
    hystrix:
      enabled: false
  user:
    name: ark-user-test

eureka:
  client:
    enabled: false
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    preferIpAddress: true
    lease-expiration-duration-in-seconds: 90
    lease-renewal-interval-in-seconds: 30

management:
  info:
    git:
      mode: full
  endpoint:
    refresh:
      enabled: true
    info:
      enabled: true
    logfile:
      enabled: true
    health:
      show-details: always
  endpoints:
    web:
      cors:
        allowed-origins: "*"
        allowed-methods: GET
