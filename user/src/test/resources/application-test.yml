spring:
  config:
    import: ""
  cloud:
    config:
      enabled: false
      import-check:
        enabled: false
    discovery:
      enabled: true
      client:
        simple:
          instances:
            ark-core-test:
              - uri: http://localhost:10102
    loadbalancer:
      ribbon:
        enabled: false
    gateway:
      discovery:
        locator:
          enabled: true
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/user_service
    username: noah
    password: righteous
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/Changelog.xml
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        default_schema: main

server:
  port: 30302

feign:
  client.config.default:
    readTimeout: 15000
    connectTimeout: 15000
    hystrix:
      enabled: false
  core:
    name: ark-core-test

jwt:
  secret: jwtsecretwordjwtsecretwordjwtsecretword12
  token.lifetime:
    access: 1
    refresh: 30

eureka:
  client:
    enabled: false
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    preferIpAddress: true
    lease-expiration-duration-in-seconds: 90
    lease-renewal-interval-in-seconds: 30

management:
  info:
    git:
      mode: full
  endpoint:
    refresh:
      enabled: true
    info:
      enabled: true
    logfile:
      enabled: true
    health:
      show-details: always
  endpoints:
    web:
      cors:
        allowed-origins: "*"
        allowed-methods: GET
